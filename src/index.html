<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>SCX Agenciamentos Marítimos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SCX Agenciamentos Marítimos — frete marítimo, aéreo e rodoviário, desembaraço aduaneiro e seguro de carga. Parceiro estratégico no comércio exterior desde 2013.">
  <meta name="theme-color" content="#05161c">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCX Agenciamentos Marítimos">
  <meta property="og:title" content="SCX Agenciamentos Marítimos">
  <meta property="og:description" content="Conectividade global e agilidade logística: frete marítimo, aéreo e rodoviário, desembaraço aduaneiro e seguro de carga.">
  <meta property="og:image" content="assets/website-images/images-home/ship-home-1920x700.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Imagem LCP da home: o banner de abertura. O preload a coloca na
       fila antes de o Angular subir. -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    href="assets/website-images/images-home/navio-frente-1920.webp"
    imagesrcset="assets/website-images/images-home/navio-frente-1024.webp 1024w, assets/website-images/images-home/navio-frente-1440.webp 1440w, assets/website-images/images-home/navio-frente-1920.webp 1920w"
    imagesizes="100vw"
    fetchpriority="high"
  >

  <link rel="icon" type="image/png" href="assets/website-images/logo-scx.png">

  <!-- Tema antes da primeira pintura. Sem isto o site carrega num tema e
       "pisca" para o outro quando o Angular sobe, em toda navegação.

       Precedência: escolha gravada > tema do sistema. Mesma regra do
       ThemeService — se mudar lá, mude aqui. -->
  <script>
    (function () {
      var theme = null;
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
      } catch (e) {}

      if (!theme) {
        theme =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
