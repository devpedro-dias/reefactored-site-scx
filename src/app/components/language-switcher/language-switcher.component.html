<div class="lang" role="group" [attr.aria-label]="'a11y.language' | translate">
  @for (language of languages; track language.code) {
    <button
      type="button"
      class="lang__btn"
      [class.is-active]="currentLang === language.code"
      [attr.aria-pressed]="currentLang === language.code"
      [attr.lang]="language.code"
      (click)="switchLanguage(language.code)"
    >
      {{ language.name }}
    </button>
  }
  <span class="lang__thumb" [class.is-en]="currentLang === 'en'" aria-hidden="true"></span>
</div>
