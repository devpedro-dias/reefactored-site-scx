# Deploy no Netlify.
# Conecte o repositório em app.netlify.com e ele lê este arquivo sozinho.

[build]
  command = "npm ci && npm run build"
  publish = "dist/scx-website/browser"

[build.environment]
  NODE_VERSION = "20"

# O Angular resolve as rotas no cliente. Sem este redirect, abrir
# /frete-maritimo direto (ou recarregar a página) devolve 404, porque o
# servidor procura um arquivo que não existe. O status 200 entrega o
# index.html mantendo a URL — é rewrite, não redirecionamento.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Os assets com hash no nome podem ser cacheados para sempre.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O index.html nunca: é ele que aponta para os bundles novos.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
